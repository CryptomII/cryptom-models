name: Build and Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
      - dev

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # Only run if CI workflow completed successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code from workflow run
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          sha: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.CI_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      # Fetch all remote refs to avoid missing branch errors
      - name: Fetch remote refs
        run: |
          git fetch origin --prune --tags

      # Determine version bump from commit messages
      - name: Determine version bump
        id: version
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"

          # Get commits since last tag or since origin/main
          if git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
            COMMITS=$(git log --format=%s "origin/$BRANCH..HEAD" 2>/dev/null || echo "")
          else
            COMMITS=$(git log --format=%s -10 2>/dev/null || echo "")
          fi

          # Check if we have any commits
          if [ -z "$COMMITS" ]; then
            echo "⚠️  No commits found, defaulting to patch version"
            echo "bump=patch" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check for conventional commit patterns
          if echo "$COMMITS" | grep -qE "^BREAKING|^.*!:"; then
            echo "✅ BREAKING change detected - major version bump"
            echo "bump=major" >> $GITHUB_OUTPUT
          elif echo "$COMMITS" | grep -qE "^feat"; then
            echo "✅ Feature detected - minor version bump"
            echo "bump=minor" >> $GITHUB_OUTPUT
          elif echo "$COMMITS" | grep -qE "^(fix|chore|docs|style|refactor|perf|test|build|ci|revert)"; then
            echo "✅ Patch-level change detected - patch version bump"
            echo "bump=patch" >> $GITHUB_OUTPUT
          else
            echo "⚠️  No conventional commits found, defaulting to patch version"
            echo "bump=patch" >> $GITHUB_OUTPUT
          fi

      # Bump version in package.json
      - name: Bump version
        run: |
          npm version ${{ steps.version.outputs.bump }} --no-git-tag-version

      # Build dist
      - run: npm run build

      # Create PR with changes
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.CI_TOKEN }}
          commit-message: "chore: build dist and bump version"
          title: "chore: Release build for ${{ github.event.workflow_run.head_branch }}"
          body: |
            Automated build triggered by merge to ${{ github.event.workflow_run.head_branch }}
            Version bump: ${{ steps.version.outputs.bump }}
          branch: release/${{ github.event.workflow_run.head_branch }}-${{ github.run_number }}
          base: ${{ github.event.workflow_run.head_branch }}
          delete-branch: false

      # For dev branch: update floating 'dev-latest' tag
      - name: Update dev-latest tag
        if: github.event.workflow_run.head_branch == 'dev'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin --tags --force
          # Delete existing dev-latest tag if it exists
          git tag -d dev-latest 2>/dev/null || true
          git push origin :refs/tags/dev-latest 2>/dev/null || true
          # Create new dev-latest tag explicitly
          git tag -fa refs/tags/dev-latest -m "Latest dev build"
          git push origin refs/tags/dev-latest --force

      # For main branch: create version tag
      - name: Create version tag
        if: github.event.workflow_run.head_branch == 'main'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin --tags --force
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "refs/tags/v$VERSION"
